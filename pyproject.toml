[project]
name = "ai-upscaler"
version = "1.0.0"
description = "AI Image Upscaler web app with local GPU support"
requires-python = ">=3.10,<3.13"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "python-multipart>=0.0.9",
  "pillow>=10.0",
  "numpy<2",
  "opencv-python>=4.8",
  "torch>=2.2",
  "torchvision>=0.17",
  "basicsr>=1.4.2",
  "facexlib>=0.3.0",
  "gfpgan>=1.3.8",
  "realesrgan>=0.3.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
# Native desktop window for the one-click app (see desktop.py).
desktop = ["pywebview>=5.0"]
# Used by build_windows.ps1 / build_windows.sh.
build = ["pyinstaller>=6.10"]

[tool.uv]
managed = true
